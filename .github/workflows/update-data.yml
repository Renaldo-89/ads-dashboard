name: Update Google Ads data

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch data from Windsor.ai
        env:
          KEY: ${{ secrets.WINDSOR_API_KEY }}
        run: |
          set -euo pipefail
          export TZ=Asia/Jakarta
          mkdir -p data

          API="https://connectors.windsor.ai/google_ads"

          TODAY=$(date +%F)
          YEST=$(date -d '1 day ago' +%F)
          D7=$(date -d '6 days ago' +%F)
          D14=$(date -d '13 days ago' +%F)
          D30=$(date -d '29 days ago' +%F)
          D60=$(date -d '59 days ago' +%F)

          fetch () {
            out="$1"; fields="$2"; from="$3"; to="$4"
            echo "-> $out  ($from .. $to)"
            curl -sS --fail --get "$API" \
              --data-urlencode "api_key=$KEY" \
              --data-urlencode "fields=$fields" \
              --data-urlencode "date_from=$from" \
              --data-urlencode "date_to=$to" \
              -o "data/$out"
            head -c 120 "data/$out"; echo
          }

          BASE="account_id,campaign,date,spend,clicks,impressions,conversions"
          HOURLY="account_id,campaign,date,hour,spend,clicks,impressions,conversions"
          AUCTION="account_id,campaign,date,search_impression_share,search_rank_lost_impression_share,search_budget_lost_impression_share,absolute_top_impression_percentage,top_impression_percentage,impressions"
          NETWORK="account_id,campaign,date,ad_network_type,device,spend,clicks,impressions,conversions"
          TERMS="account_id,campaign,search_term,spend,clicks,impressions,conversions"

          fetch daily.json    "$BASE"    "$D60"   "$TODAY"
          fetch hourly.json   "$HOURLY"  "$D30"   "$TODAY"
          fetch auction.json  "$AUCTION" "$D30"   "$TODAY"
          fetch network.json  "$NETWORK" "$D30"   "$TODAY"

          fetch terms_today.json     "$TERMS" "$TODAY" "$TODAY"
          fetch terms_yesterday.json "$TERMS" "$YEST"  "$YEST"
          fetch terms_7.json         "$TERMS" "$D7"    "$TODAY"
          fetch terms_14.json        "$TERMS" "$D14"   "$TODAY"
          fetch terms_30.json        "$TERMS" "$D30"   "$TODAY"

          printf '{"updated_at":"%s","timezone":"Asia/Jakarta"}\n' "$(date '+%Y-%m-%d %H:%M')" > data/meta.json
          cat data/meta.json

      # Arsip yang menumpuk, tidak pernah menggeser data lama keluar.
      #
      # daily.json hanya memuat 60 hari terakhir: tiap hari, satu hari terlama
      # terdorong keluar dan hilang selamanya. Selama Windsor masih bisa
      # membacanya itu tidak masalah — tapi kalau akun iklan ditangguhkan dan
      # Windsor kehilangan akses, riwayat lamanya tidak ada di mana pun lagi.
      #
      # Arsip ini menggabungkan tiap tarikan baru ke berkas yang sudah ada,
      # ditandai tanggal + akun + kampanye. Angka yang sudah ada diperbarui
      # kalau Windsor merevisinya, dan baris lama tidak pernah dibuang.
      - name: Arsipkan riwayat iklan
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta

          ARSIP = 'data/riwayat-iklan.json'

          def baca(p):
              if not os.path.exists(p): return None
              try:
                  with open(p, encoding='utf-8') as f: return json.load(f)
              except Exception: return None

          def barisnya(d):
              if d is None: return []
              r = d.get('data') if isinstance(d, dict) else d
              return r if isinstance(r, list) else []

          baru = barisnya(baca('data/daily.json'))
          if not baru:
              print('daily.json kosong atau gagal dibaca — arsip tidak disentuh.')
              raise SystemExit(0)

          lama = barisnya(baca(ARSIP))
          kunci = lambda x: (
              str(x.get('date') or ''),
              str(x.get('account_id') or ''),
              str(x.get('campaign') or ''),
          )

          gabung = {kunci(x): x for x in lama if x.get('date')}
          sebelum = len(gabung)
          for x in baru:
              if x.get('date'): gabung[kunci(x)] = x

          hasil = sorted(gabung.values(), key=kunci)
          wib = timezone(timedelta(hours=7))
          isi = {
              'updated_at': datetime.now(wib).strftime('%Y-%m-%d %H:%M'),
              'timezone': 'Asia/Jakarta',
              'catatan': 'Arsip menumpuk. Baris lama tidak pernah dibuang walau Windsor kehilangan akses ke akunnya.',
              'jumlah': len(hasil),
              'data': hasil,
          }
          with open(ARSIP, 'w', encoding='utf-8') as f:
              json.dump(isi, f, ensure_ascii=False, separators=(',', ':'))

          tgl = sorted({x['date'] for x in hasil if x.get('date')})
          akun = sorted({str(x.get('account_id') or '') for x in hasil})
          print(f'arsip: {sebelum} -> {len(hasil)} baris (+{len(hasil)-sebelum})')
          print(f'rentang: {tgl[0] if tgl else "-"} .. {tgl[-1] if tgl else "-"}')
          print(f'akun: {", ".join(akun)}')
          PY

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "Perbarui data Google Ads"
            git push
          fi
