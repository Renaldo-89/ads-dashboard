<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Race GMV Dealer</title>
<meta property="og:title" content="🏁 Race GMV Dealer">
<meta property="og:description" content="Lihat posisi kamu di balapan GMV dealer bulan ini. Siapa yang memimpin?">
<meta property="og:image" content="https://renaldo-89.github.io/ads-dashboard/hiro-512.png">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="hiro-512.png">
<!-- Halaman publik race dealer untuk dibagikan ke grup WhatsApp.
     Dibuat dari kode Race di kerja.html (CSS + pgDealer). Kalau tampilan race
     di kerja.html diubah, salin ulang bagian itu ke sini. Data diambil dari
     Worker lewat ?race_publik=1 dengan kode di link (?k=...). -->
<style>
  :root { color-scheme: light;
    --ink:#1E1B39; --ink-2:#454168; --muted:#6E6A8F; --faint:#A5A1C0;
    --line:#EEEBFA; --line-2:#F5F3FD; --panel:#FFFFFF; --bg:#F7F6FE;
    --blue:#4F46E5; --blue-soft:#EEF0FF;
    --green:#10B981; --green-soft:#E6FBF4;
    --amber:#F59E0B; --amber-soft:#FEF6E7;
    --red:#EF4444;   --red-soft:#FEECEC;
    --violet:#7C3AED; --violet-soft:#F3EEFE;
    --pink:#D946EF;  --pink-soft:#FCEBFE;
    --toska:#06B6D4; --toska-soft:#E6F9FD;
    --green-ink:#047857; --amber-ink:#B45309; --red-ink:#B91C1C; --red-line:#FBD5D5;
    --grad:linear-gradient(135deg,#4F46E5 0%,#7C3AED 55%,#D946EF 100%);
    --bayang:0 4px 20px rgba(79,70,229,.07);
    --bayang-2:0 10px 34px rgba(79,70,229,.12);
    --kaca:rgba(255,255,255,.86); --kaca-2:rgba(255,255,255,.22);
    --lembut:linear-gradient(140deg,#FBFAFF,#F6F3FE);
    --hover:#FBFAFF; --scroll:#DED9F5; --kilau:rgba(255,255,255,.85); --kaca-top:rgba(251,250,255,.82); --titik:#D6D9DE;
    --sapa:linear-gradient(120deg,#EEF0FF 0%,#F5EEFE 55%,#FDEEFE 100%); --kartu-gelap:linear-gradient(150deg,#211E42 0%,#1A1836 60%,#141229 100%);
    --latar:radial-gradient(760px 460px at 88% -8%, rgba(124,58,237,.14), transparent 62%),
      radial-gradient(680px 420px at 4% 8%,  rgba(79,70,229,.10),  transparent 60%),
      radial-gradient(720px 460px at 60% 108%, rgba(217,70,239,.10), transparent 62%),
      linear-gradient(180deg,#FBFAFF 0%,#F7F6FE 60%,#F4F2FD 100%);
    --sb:248px; }

  /* ---------- palet gelap ---------- */
  
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  body::before { content:''; position:fixed; inset:0; z-index:-1; background:var(--latar); }
  .wadah { max-width:1040px; margin:0 auto; padding:18px 16px 40px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .chips button { font:inherit; font-size:12.5px; font-weight:600; padding:7px 14px; border-radius:999px; cursor:pointer;
    border:1px solid var(--line); background:var(--panel); color:var(--ink-2); }
  .chips button.on { background:var(--grad); color:#fff; border-color:transparent; }
  .kaki { margin-top:14px; text-align:center; font-size:11px; color:var(--faint); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:16px; }
  .empty { padding:40px 20px; text-align:center; color:var(--muted); font-size:13px; }
  /* ---------- race dealer ---------- */
  .rc-arena { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;
    padding:18px 22px; border-radius:16px; margin-bottom:16px; color:#fff;
    background:linear-gradient(120deg,#4F46E5 0%,#7C3AED 55%,#DB2777 100%);
    box-shadow:0 14px 30px -16px rgba(124,58,237,.6); }
  .rc-cap { display:flex; align-items:center; gap:8px; font-size:10px; font-weight:800; letter-spacing:1.2px;
    color:rgba(255,255,255,.7); }
  .rc-bendera { width:16px; height:11px; border-radius:2px;
    background:conic-gradient(#fff 25%, #1F2937 0 50%, #fff 0 75%, #1F2937 0) 0 0/5.5px 5.5px; }
  .rc-judul { margin-top:6px; font-size:21px; font-weight:800; letter-spacing:-.4px; }
  .rc-judul b { color:#FDE68A; }
  .rc-sub { margin-top:4px; font-size:11.5px; color:rgba(255,255,255,.7); max-width:70ch; }
  .rc-waktu { display:flex; align-items:center; gap:9px; padding:8px 14px; border-radius:12px;
    background:rgba(255,255,255,.18); }
  .rc-waktu b { font-size:28px; font-weight:800; line-height:1; color:#FDE68A; font-variant-numeric:tabular-nums; }
  .rc-waktu span { font-size:10.5px; font-weight:600; line-height:1.25; color:rgba(255,255,255,.8); }

  .rc-podium { display:grid; grid-template-columns:1fr 1.1fr 1fr; align-items:end; gap:12px; margin:4px 0 16px; }
  .rc-pod { text-align:center; }
  .rc-mahkota { font-size:20px; line-height:1; margin-bottom:2px; }
  .rc-ava { margin:0 auto 6px; display:grid; place-items:center; width:48px; height:48px; border-radius:50%;
    font-size:15px; font-weight:800; color:#fff;
    background:linear-gradient(135deg, color-mix(in srgb, var(--m) 55%, #fff), var(--m));
    box-shadow:0 0 0 3px color-mix(in srgb, var(--m) 22%, transparent); }
  .p1 .rc-ava { width:58px; height:58px; font-size:18px; }
  .rc-pod-nama { font-size:13px; font-weight:800; color:var(--ink); }
  .rc-pod-gmv { font-size:20px; font-weight:800; letter-spacing:-.4px; color:var(--ink); }
  .p1 .rc-pod-gmv { font-size:24px; }
  .rc-pod-gmv small { font-size:10px; font-weight:700; color:var(--muted); }
  .rc-pod-ket { font-size:11px; color:var(--muted); margin:2px 0 8px; }
  .rc-pod-ket b { color:var(--ink-2); }
  .rc-tiang { border-radius:12px 12px 4px 4px; display:grid; place-items:center; font-size:28px; font-weight:800;
    color:#fff; background:linear-gradient(180deg, color-mix(in srgb, var(--m) 75%, #fff), var(--m));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4); }
  .p1 .rc-pod-gmv { color:#D97706; }
  .p1 .rc-tiang { height:96px; } .p2 .rc-tiang { height:70px; } .p3 .rc-tiang { height:52px; }

  .rc-trek { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:12px 16px 6px;
    box-shadow:var(--bayang); margin-bottom:14px; }
  .rc-trek-kop { display:flex; justify-content:space-between; font-size:10.5px; font-weight:800; letter-spacing:1px;
    text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
  .rc-finis-lbl { color:var(--faint); }
  .rc-jalur { display:grid; grid-template-columns:30px 1fr auto; gap:12px; align-items:center; padding:10px 0;
    border-top:1px solid var(--line-2); }
  .rc-jalur:first-of-type { border-top:0; }
  .rc-no { display:grid; place-items:center; width:26px; height:26px; border-radius:8px; font-weight:800; font-size:12px;
    color:#fff; background:var(--w); }
  .rc-baris { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px; color:var(--ink); margin-bottom:6px; }
  .rc-kode { font-size:10.5px; color:var(--faint); }
  .rc-tag { font-size:10px; font-weight:700; padding:2px 8px; border-radius:999px; }
  .rc-tag.panas { background:var(--amber-soft); color:var(--amber-ink, var(--amber)); }
  .rc-tag.ketat { background:var(--pink-soft); color:var(--pink); }
  .rc-tag.diam { background:var(--line-2); color:var(--faint); }
  .rc-jalan { position:relative; height:10px; border-radius:999px; background:var(--line-2); }
  .rc-jalan::after { content:''; position:absolute; right:0; top:-3px; bottom:-3px; width:2px; background:var(--line); }
  .rc-jalan i { position:absolute; inset:0 auto 0 0; border-radius:999px;
    background:linear-gradient(90deg, color-mix(in srgb, var(--w) 30%, transparent), var(--w));
    animation:rc-lari .9s ease-out both; }
  .rc-pelari { position:absolute; top:50%; transform:translate(-50%,-50%); display:grid; place-items:center;
    width:24px; height:24px; border-radius:50%; font-size:9px; font-weight:800; color:#fff; background:var(--w);
    border:2px solid var(--panel); animation:rc-masuk .9s ease-out both; }
  .rc-nilai { text-align:right; min-width:88px; }
  .rc-nilai b { display:block; font-size:15px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; }
  .rc-nilai span { font-size:10.5px; color:var(--red-ink, var(--red)); font-weight:600; }
  .juara { background:linear-gradient(90deg, rgba(245,158,11,.08), transparent 70%); border-radius:10px; }
  .juara .rc-nilai span { color:var(--muted); font-weight:400; }
  .rc-rinci summary { cursor:pointer; font-size:12px; font-weight:700; color:var(--violet); margin:4px 0 10px; }
  .rc .rc-arena { animation:rc-turun .5s ease-out both; }
  .rc .rc-waktu b { animation:rc-detak 1.6s ease-in-out infinite; }
  .rc .rc-pod { animation:rc-naik .6s cubic-bezier(.2,.8,.2,1) both; }
  .rc .rc-pod.p1 { animation-delay:.25s; } .rc .rc-pod.p2 { animation-delay:.1s; } .rc .rc-pod.p3 { animation-delay:.4s; }
  .rc .rc-tiang { transform-origin:bottom; animation:rc-tumbuh .7s cubic-bezier(.2,.8,.2,1) both; animation-delay:inherit; }
  .rc .rc-mahkota { animation:rc-loncat 2.4s ease-in-out 1s infinite; }
  .rc .rc-jalur { animation:rc-geser .5s ease-out both; animation-delay:var(--d); }
  .rc .rc-jalan i { animation-delay:calc(var(--d) + .2s); }
  .rc .rc-pelari { animation-delay:calc(var(--d) + .2s); }
  .rc .juara .rc-pelari { animation:rc-masuk .9s ease-out both, rc-nadi 1.8s ease-in-out 1.4s infinite; }
  /* gerak terus setelah tampil: pelan, tidak mencolok */
  .rc .rc-arena { background-size:200% 200%; animation:rc-turun .5s ease-out both, rc-langit 12s ease-in-out .5s infinite; }
  .rc .rc-jalan { overflow:visible; }
  .rc .rc-jalan::before { content:''; position:absolute; inset:0; border-radius:999px; opacity:.55;
    background:repeating-linear-gradient(90deg, transparent 0 10px, color-mix(in srgb, var(--w) 18%, transparent) 10px 14px);
    background-size:28px 100%; animation:rc-jalanan 1.6s linear infinite; }
  .rc .rc-jalan i { overflow:hidden; }
  .rc .rc-jalan i::after { content:''; position:absolute; top:0; bottom:0; width:60px; left:-60px; border-radius:999px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
    animation:rc-sapu 3.2s ease-in-out infinite; animation-delay:calc(var(--d) + 1.4s); }
  .rc .rc-pelari { animation:rc-masuk .9s ease-out both, rc-lompat .6s ease-in-out infinite;
    animation-delay:calc(var(--d) + .2s), calc(var(--d) + 1.2s); }
  .rc .juara .rc-pelari { animation:rc-masuk .9s ease-out both, rc-lompat .6s ease-in-out infinite, rc-nadi 1.8s ease-in-out infinite;
    animation-delay:.2s, 1.2s, 1.4s; }
  .rc .rc-jalur:has(.rc-tag.diam) .rc-pelari { animation:rc-masuk .9s ease-out both; }
  .rc .rc-tag.ketat { animation:rc-kedip 1.4s ease-in-out infinite; }
  .rc .rc-tiang { position:relative; overflow:hidden; }
  .rc .rc-tiang::after { content:''; position:absolute; top:0; bottom:0; width:35%; left:-50%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.28), transparent); animation:rc-sapu-tiang 6s ease-in-out 1.5s infinite; }
  @keyframes rc-langit { 50% { background-position:100% 50%; } }
  @keyframes rc-jalanan { to { background-position:-28px 0; } }
  @keyframes rc-sapu { 0%,55% { left:-60px; } 100% { left:110%; } }
  @keyframes rc-lompat { 50% { transform:translate(-50%,-62%); } }
  @keyframes rc-kedip { 50% { opacity:.55; } }
  @keyframes rc-sapu-tiang { 0%,75% { left:-50%; } 100% { left:130%; } }
  @keyframes rc-turun { from { opacity:0; transform:translateY(-10px); } }
  @keyframes rc-naik { from { opacity:0; transform:translateY(24px); } }
  @keyframes rc-tumbuh { from { transform:scaleY(0); } }
  @keyframes rc-loncat { 0%,70%,100% { transform:translateY(0); } 80% { transform:translateY(-6px); } 90% { transform:translateY(0); } }
  @keyframes rc-geser { from { opacity:0; transform:translateX(-14px); } }
  @keyframes rc-detak { 50% { transform:scale(1.08); } }
  @keyframes rc-nadi { 50% { box-shadow:0 0 0 6px color-mix(in srgb, var(--w) 25%, transparent); } }
  @keyframes rc-lari { from { width:0; } }
  @keyframes rc-masuk { from { left:2%; opacity:0; } }
  @media (max-width:620px) {
    .rc-arena { padding:16px; } .rc-judul { font-size:18px; }
    .rc-podium { gap:6px; } .rc-ava { width:40px; height:40px; font-size:13px; } .p1 .rc-ava { width:48px; height:48px; }
    .rc-pod-gmv { font-size:16px; } .p1 .rc-pod-gmv { font-size:19px; }
    .p1 .rc-tiang { height:72px; } .p2 .rc-tiang { height:54px; } .p3 .rc-tiang { height:40px; }
    .rc-jalur { grid-template-columns:26px 1fr auto; gap:8px; } .rc-nilai { min-width:66px; }
  }
  @media (prefers-reduced-motion: reduce) { .rc *, .rc-jalan i, .rc-pelari { animation:none !important; } }

  
</style>
</head>
<body>
<div class="wadah"><div id="isi"><div class="panel"><div class="empty">Memuat race&hellip;</div></div></div>
<div class="kaki" id="kaki"></div></div>
<script>
(() => {
  const RACE_PUBLIK = true;
  const PROXY = 'https://ads-proxy.renaldo1600016091.workers.dev/';
  const KODE = new URLSearchParams(location.search).get('k') || '';
  const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const fN = n => Math.round(Number(n) || 0).toLocaleString('id-ID');
  const inisial = n => String(n || '?').trim().slice(0, 2).toUpperCase();
  const BULAN_ID = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const BLNP = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const I = { alert: '!' };
  const periodeSekarang = () => { const n = new Date(); return String(n.getFullYear()) + String(n.getMonth() + 1).padStart(2, '0'); };
  let dealerPeriode = null;
  const dealerCache = new Map(), dealerMemuat = new Set();
  let waktu = {};

  function muatDealer(p) {
    if (dealerCache.has(p) || dealerMemuat.has(p)) return;
    dealerMemuat.add(p);
    fetch(PROXY + '?race_publik=1&kode=' + encodeURIComponent(KODE) + '&period=' + p)
      .then(r => r.json().then(j => ({ ok: r.ok, j })))
      .then(({ ok, j }) => {
        if (!ok || !Array.isArray(j.data)) throw new Error(j && j.error || 'gagal');
        waktu[p] = j.diperbarui;
        dealerCache.set(p, j.data.map(x => ({ username: x.nama, dealer_id: '', dealer_position_name: x.posisi,
          total_pv: 0, group_pv: 0, sum_pv: x.gmv, active_downlines: 0 })));
      })
      .catch(() => dealerCache.set(p, null))
      .finally(() => { dealerMemuat.delete(p); render(); });
  }

  let dealerAnimasi = null;   // periode yang angkanya sudah dianimasikan
  function pgDealer() {
    if (!dealerPeriode) dealerPeriode = periodeSekarang();
    const opsi = Array.from({ length: 6 }, (_, i) => {
      const n = new Date(); n.setDate(1); n.setMonth(n.getMonth() - i);
      return { v: String(n.getFullYear()) + String(n.getMonth() + 1).padStart(2, '0'),
        l: BLNP[n.getMonth()] + ' ' + n.getFullYear() };
    });
    const filterHtml = `<div class="chips" style="margin-bottom:14px">
      ${opsi.map(o => `<button class="${dealerPeriode===o.v?'on':''}" data-dealer-bulan="${o.v}">${esc(o.l)}</button>`).join('')}
    </div>`;

    if (!dealerCache.has(dealerPeriode)) {
      muatDealer(dealerPeriode);
      return filterHtml + `<div class="panel"><div class="empty"><div class="spinner"></div>
        Menarik data dealer dari Globemerce&hellip;</div></div>`;
    }
    const rows = dealerCache.get(dealerPeriode);
    if (!rows) return filterHtml + `<div class="panel"><div class="empty">
      <div class="big" style="background:var(--red-soft);color:var(--red)">${I.alert}</div>
      <b>Gagal menarik data dealer</b><br>Cek token Globemerce di Worker, mungkin sudah kedaluwarsa.</div></div>`;
    if (!rows.length) return filterHtml + `<div class="panel"><div class="empty">
      Belum ada dealer downline untuk periode ini.</div></div>`;

    const R = rows.map(x => ({
      nama: x.username || x.dealer_id, kode: x.dealer_id,
      posisi: x.dealer_position_name || '—',
      personal: Number(x.total_pv) || 0, grup: Number(x.group_pv) || 0,
      gmv: Number(x.sum_pv) || 0, downline: Number(x.active_downlines) || 0,
      mata: x.currency_symbol || 'Rp',
    })).sort((a, b) => b.gmv - a.gmv);

    const total = R.reduce((a, c) => ({ personal: a.personal + c.personal,
      grup: a.grup + c.grup, gmv: a.gmv + c.gmv }), { personal: 0, grup: 0, gmv: 0 });
    const maks = Math.max(...R.map(c => c.gmv), 1);
    const th = Number(dealerPeriode.slice(0, 4)), bl = Number(dealerPeriode.slice(4, 6));
    const kini = dealerPeriode === periodeSekarang();
    const akhir = new Date(th, bl, 0).getDate();
    const sisaHari = kini ? akhir - new Date().getDate() + 1 : 0;
    const namaBulan = BULAN_ID[bl - 1] + ' ' + th;
    const MEDALI = ['#F59E0B', '#94A3B8', '#C2410C'];
    // warna lintasan per peringkat: emas, perak, perunggu, lalu warna-warna tim balap
    const WARNA_TIM = ['#F59E0B', '#94A3B8', '#C2410C', '#06B6D4', '#8B5CF6', '#EC4899', '#10B981', '#3B82F6', '#F43F5E', '#84CC16'];

    // ---- arena: judul, hitung mundur, ringkasan ----
    const pemimpin = R[0];
    const arena = `<div class="rc-arena">
      <div class="rc-arena-kiri">
        <div class="rc-cap"><span class="rc-bendera"></span>RACE GMV DEALER · ${esc(namaBulan.toUpperCase())}</div>
        <div class="rc-judul">${pemimpin && pemimpin.gmv ? `<b>${esc(pemimpin.nama)}</b> memimpin balapan` : 'Balapan belum dimulai'}</div>
        <div class="rc-sub">${fN(R.length)} dealer bertanding · total ${fN(Math.round(total.gmv))} GMV${
          typeof RACE_PUBLIK === 'undefined' ? ' · GMV group kamu = GMV personal kamu + GMV dari dealer' : ''}</div>
      </div>
      <div class="rc-waktu">${kini
        ? `<b>${fN(sisaHari)}</b><span>hari lagi<br>garis finis</span>`
        : `<b>🏁</b><span>balapan<br>selesai</span>`}</div>
    </div>`;

    // ---- podium 3 besar ----
    const urutPodium = [1, 0, 2].filter(i => R[i]);
    const podiumHtml = `<div class="rc-podium">${urutPodium.map(i => {
      const c = R[i];
      const jarak = i > 0 ? Math.max(0, R[i - 1].gmv - c.gmv) : (R[1] ? c.gmv - R[1].gmv : 0);
      return `<div class="rc-pod p${i + 1}" style="--m:${MEDALI[i]}">
        ${i === 0 ? '<div class="rc-mahkota">👑</div>' : ''}
        <div class="rc-ava">${esc(inisial(c.nama))}</div>
        <div class="rc-pod-nama">${esc(c.nama)}</div>
        <div class="rc-pod-gmv"><span data-hitung="${Math.round(c.gmv)}">${fN(Math.round(c.gmv))}</span><small> GMV</small></div>
        <div class="rc-pod-ket">${i === 0
          ? (R[1] ? `unggul <b>${fN(Math.round(jarak))}</b> dari #2` : 'tanpa lawan')
          : (jarak ? `<b>${fN(Math.round(jarak))}</b> lagi salip #${i}` : `seri dengan #${i}`)}</div>
        <div class="rc-tiang"><span>${i + 1}</span></div>
      </div>`; }).join('')}</div>`;

    // ---- lintasan: semua dealer ----
    const lintasan = `<div class="rc-trek">
      <div class="rc-trek-kop"><span>Lintasan</span><span class="rc-finis-lbl">finis = pemimpin</span></div>
      ${R.map((c, i) => {
        const pct = c.gmv / maks * 100;
        const jarak = i > 0 ? Math.max(0, R[i - 1].gmv - c.gmv) : 0;
        const warna = WARNA_TIM[i % WARNA_TIM.length];
        const status = !c.gmv ? '<span class="rc-tag diam">belum start</span>'
          : i === 0 ? '<span class="rc-tag panas">🔥 terdepan</span>'
          : jarak && jarak <= maks * 0.1 ? `<span class="rc-tag ketat">mengejar #${i}</span>` : '';
        return `<div class="rc-jalur${i === 0 ? ' juara' : ''}" style="--w:${warna};--d:${Math.min(i, 12) * 70}ms">
          <div class="rc-no">${i + 1}</div>
          <div class="rc-isi">
            <div class="rc-baris"><b>${esc(c.nama)}</b><span class="rc-kode">${esc(c.posisi)}</span>${status}</div>
            <div class="rc-jalan"><i style="width:${Math.max(pct, 0.5).toFixed(1)}%"></i>
              <span class="rc-pelari" style="left:${Math.min(Math.max(pct, 2), 97).toFixed(1)}%">${esc(inisial(c.nama))}</span></div>
          </div>
          <div class="rc-nilai"><b data-hitung="${Math.round(c.gmv)}">${fN(Math.round(c.gmv))}</b>
            <span>${i === 0 ? 'GMV' : jarak ? '−' + fN(Math.round(jarak)) + ' dari #' + i : 'seri'}</span></div>
        </div>`; }).join('')}
    </div>`;

    // ---- rincian (tabel lama, dipadatkan) ----
    const rincian = `<details class="rc-rinci"><summary>Lihat rincian angka per dealer</summary>
      <div class="panel tight"><div class="scroll-x"><table class="dt pesanan">
        <thead><tr><th>Dealer</th><th>Posisi</th><th class="num">Downline aktif</th>
          <th class="num">GMV personal dealer</th><th class="num">GMV jaringan dealer</th><th class="num">Total GMV</th></tr></thead>
        <tbody>${R.map((c, i) => `<tr>
            <td class="nama"><b>#${i + 1} ${esc(c.nama)}</b><span style="color:var(--faint);font-weight:500"> (${esc(c.kode)})</span></td>
            <td>${esc(c.posisi)}</td>
            <td class="num">${fN(c.downline)}</td>
            <td class="num">${fN(c.personal)}</td>
            <td class="num">${fN(c.grup)}</td>
            <td class="num"><b>${fN(c.gmv)}</b></td>
          </tr>`).join('')}</tbody>
      </table></div></div></details>`;

    // angka berlari dari 0 saat halaman dibuka (sekali per periode)
    if (dealerAnimasi !== dealerPeriode) {
      dealerAnimasi = dealerPeriode;
      setTimeout(() => {
        const el = [...document.querySelectorAll('.rc-podium [data-hitung], .rc-trek [data-hitung]')];
        if (!el.length || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const mulai = performance.now(), lama = 1100;
        const langkah = now => {
          const f = Math.min(1, (now - mulai) / lama), e = 1 - Math.pow(1 - f, 3);
          for (const x of el) x.textContent = fN(Math.round(Number(x.dataset.hitung) * e));
          if (f < 1) requestAnimationFrame(langkah);
        };
        requestAnimationFrame(langkah);
      }, 0);
    }
    return filterHtml + `<div class="rc">${arena + podiumHtml + lintasan}</div>` + (typeof RACE_PUBLIK === 'undefined' ? rincian : '');
  }


  function render() {
    if (!KODE) { document.getElementById('isi').innerHTML = '<div class="panel"><div class="empty">Link race tidak lengkap. Minta link terbaru ke admin.</div></div>'; return; }
    document.getElementById('isi').innerHTML = pgDealer();
    const w = waktu[dealerPeriode];
    document.getElementById('kaki').textContent = w
      ? 'Diperbarui ' + new Date(w).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }) + ' · angka dari Globemerce, diperbarui tiap 10 menit'
      : '';
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('button[data-dealer-bulan]');
    if (b) { dealerPeriode = b.dataset.dealerBulan; render(); }
  });
  render();
  setInterval(() => { if (dealerPeriode === periodeSekarang()) { dealerCache.delete(dealerPeriode); muatDealer(dealerPeriode); } }, 10 * 60 * 1000);
})();
</script>
</body>
</html>
